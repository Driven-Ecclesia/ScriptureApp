<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripture Display</title>
<style>
    :root{
        --navy:#0b1730;
        --navy-2:#16234a;
        --gold:#c9a24a;
        --gold-soft:#e3d6ae;
        --cream:#f3ead2;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    html, body{
        height:100%;
        font-family:'Georgia','Times New Roman',serif;
        color: var(--cream);
        overflow:hidden;
    }
    #bgLayer{
        position:fixed; inset:0;
        background: linear-gradient(180deg, #0b1730 0%, #16234a 55%, #0b1730 100%);
        background-size:cover;
        background-position:center;
        transition: background 0.6s ease;
        z-index:0;
    }
    #bgOverlay{
        position:fixed; inset:0;
        background: rgba(0,0,0,0);
        transition: background 0.6s ease;
        z-index:1;
        pointer-events:none;
    }
    .frame{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 2.5vh 5vw 3vh;
    text-align:center;
    position:relative;
    z-index:2;
    }
    #content{
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    width: 100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    }

    #slideLayer{
        position:fixed; inset:0;
        background:#000;
        z-index:20;
        display:none;
        align-items:center;
        justify-content:center;
    }
    #slideLayer img{
        max-width:100%;
        max-height:100%;
        object-fit:contain;
        display:block;
    }

    .points-title{
        font-size:2.2vw;
        color: var(--gold);
        letter-spacing:1px;
        margin-bottom:3.5vh;
        font-style:italic;
    }
    .points-text{
        white-space:pre-wrap;
        overflow-wrap:break-word;
        word-break:break-word;
        text-align:left;
        max-width:1250px;
        width:100%;
        margin:0 auto;
        color:#ffffff;
        line-height:1.6;
    }
    
    .brand-header{
        flex: 0 0 auto;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
        margin-bottom: 2.5vh;
    }
    .brand-header img{
        height:3.2vh;
        min-height:26px;
        max-height:44px;
        width:auto;
    }
    .community-name{
        text-align:center;
        font-size:1.1vw;
        letter-spacing:4px;
        text-transform:uppercase;
        color: var(--gold);
    }
    .verse-text{
        line-height:1.5;
        overflow-wrap:break-word;
        word-break:break-word;
        max-width: 1400px;
        color:#ffffff;
        transition: opacity 0.4s ease;
        /* font-size is still set dynamically in JS based on verse length */
    }
    .verse-ref{
        margin-top:5.5vh;
        font-size:1.5vw;
        color: var(--gold-soft);
        letter-spacing:1px;
        font-style:italic;
    }
    .rule{
        width:120px;
        height:2px;
        background: var(--gold);
        margin: 5vh auto 0 auto;
    }
    .placeholder{
        color:#8a92b3;
        font-size:1.6vw;
        font-style:italic;
        letter-spacing:0.5px;
    }
    .placeholder .cross{
        font-size:4vw;
        color: var(--gold);
        margin-bottom:20px;
        display:block;
    }
    .connection-note{
        flex: 0 0 auto;
        margin-top: 2vh;
        text-align:center;
        font-size:1.2vw;
        color:#e3d6ae;
        letter-spacing:1px;
    }

    @media (max-width: 700px) {
        .verse-text{ font-size:6vw; }
        .verse-ref{ font-size:3.2vw; }
        .community-name{ font-size:3vw; }
        .placeholder{ font-size:4vw; }
    }
</style>
</head>

        <div class="community-name" id="communityName">Barracks</div>
    </div>
    <div id="content">
        <div class="placeholder">
            <span class="cross">&#10013;</span>
            Waiting for scripture…
        </div>
    </div>
    <div class="connection-note">Read it, Love it, Live it.</div>
</div>

<div id="slideLayer">
    <img id="slideImg" src="" alt="">
</div>
<audio id="bgAudio" loop style="display:none;"></audio>

<div id="soundGate" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:50; display:none; align-items:center; justify-content:center; color:#e3d6ae; font-family:'Georgia','Times New Roman',serif; font-size:1.8vw; letter-spacing:1px; cursor:pointer;">
    Tap to enable sound
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBowRtZf_IoFiiIPzMNNlkTxKQ2krCRJBM",
    authDomain: "driven-scripture.firebaseapp.com",
    databaseURL: "https://driven-scripture-default-rtdb.firebaseio.com",
    projectId: "driven-scripture",
    storageBucket: "driven-scripture.firebasestorage.app",
    messagingSenderId: "129202807693",
    appId: "1:129202807693:web:4eb080f18962aa6a9cd3c4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const content = document.getElementById('content');
    const communityNameEl = document.getElementById('communityName');

    const savedName = localStorage.getItem('scripture_community_name');
    if (savedName) communityNameEl.textContent = savedName;

    const params = new URLSearchParams(window.location.search);
    const roomCode = params.get('room') || 'main';

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Picks a font size (in vw) based on how long the verse text is,
    // so long verses (e.g. Esther 8:9) shrink to fit instead of overflowing.
    function getFontSize(text) {
        const len = text.length;
        if (len <= 90)  return 3.9;   // short verse, e.g. John 11:35
        if (len <= 160) return 3.2;
        if (len <= 260) return 2.6;
        if (len <= 380) return 2.2;
        if (len <= 550) return 1.8;  // covers verses like Esther 8:9 (~950 chars in some translations)
        if (len <= 800) return 1.5;
        return 1.3;                   // extremely long passages / multi-verse ranges
    }

    // Shrinks el's font-size (in vw) step by step until its content fits inside
    // container's height with no overflow — used instead of scrolling so text
    // never spills over the logo/community name or off the bottom of the screen.
    function fitTextToContainer(el, container, minVw) {
        let size = parseFloat(el.style.fontSize) || 2;
        let guard = 0;
        while (container.scrollHeight > container.clientHeight + 1 && size > minVw && guard < 100) {
            size -= 0.08;
            el.style.fontSize = size.toFixed(2) + 'vw';
            guard++;
        }
        return size;
    }

    function showSlide(url) {
        document.getElementById('slideImg').src = url;
        document.getElementById('slideLayer').style.display = 'flex';
    }

    function hideSlide() {
        document.getElementById('slideLayer').style.display = 'none';
    }

    function handleMessage(msg) {
        if (msg.type !== 'show_slide') hideSlide();

        if (msg.type === 'show_verse') {
            const v = msg.verse;
            const fontSize = getFontSize(v.text);
            content.style.opacity = 0;
            setTimeout(() => {
                content.innerHTML = `
                    <div class="verse-text" id="verseTextEl" style="font-size:${fontSize}vw;">${escapeHtml(v.text)}</div>
                    <div class="rule"></div>
                    <div class="verse-ref">${escapeHtml(v.reference)} &mdash; ${escapeHtml(v.translationName)}</div>
                `;
                const verseEl = document.getElementById('verseTextEl');
                if (verseEl) fitTextToContainer(verseEl, content, 0.6);
                content.style.opacity = 1;
            }, 200);
        } else if (msg.type === 'show_points') {
            const title = msg.title || '';
            const text = msg.text || '';
            const titleHtml = title ? `<div class="points-title" id="pointsTitleEl">${escapeHtml(title)}</div>` : '';
            const textHtml = text
                ? `<div class="points-text" id="pointsTextEl" style="font-size:2.6vw;">${escapeHtml(text)}</div>`
                : `<div class="placeholder"><span class="cross">&#10013;</span>Waiting for notes…</div>`;
            content.style.opacity = 0;
            setTimeout(() => {
                content.innerHTML = titleHtml + textHtml;
                const textEl = document.getElementById('pointsTextEl');
                const titleEl = document.getElementById('pointsTitleEl');
                if (textEl) {
                    const finalSize = fitTextToContainer(textEl, content, 0.6);
                    // Keep the title in proportion to the body text instead of towering over
                    // a heavily-shrunk body when the notes are very long.
                    if (titleEl) titleEl.style.fontSize = Math.min(2.2, finalSize + 0.6) + 'vw';
                }
                content.style.opacity = 1;
            }, 200);
        } else if (msg.type === 'show_slide') {
            showSlide(msg.value);
        } else if (msg.type === 'clear') {
            content.innerHTML = `
                <div class="placeholder">
                    <span class="cross">&#10013;</span>
                    Waiting for scripture…
                </div>
            `;
        } else if (msg.type === 'play_music') {
            playMusic(msg.url);
        } else if (msg.type === 'pause_music') {
            pauseMusic();
        } else if (msg.type === 'stop_music') {
            stopMusic();
        } else if (msg.type === 'set_volume') {
            setVolume(msg.value);
        } else if (msg.type === 'community_name') {
            communityNameEl.textContent = msg.name;
        } else if (msg.type === 'background') {
            applyBackground(msg);
        }
    }

    function applyBackground(bg) {
        const bgLayer = document.getElementById('bgLayer');
        const bgOverlay = document.getElementById('bgOverlay');
        const brandHeader = document.querySelector('.brand-header');

        if (bg.mode === 'default') {
            bgLayer.style.background = 'linear-gradient(180deg, #0b1730 0%, #16234a 55%, #0b1730 100%)';
            bgOverlay.style.background = 'rgba(0,0,0,0)';
        } else if (bg.mode === 'color') {
            bgLayer.style.background = bg.value;
            bgOverlay.style.background = 'rgba(0,0,0,0.15)';
        } else if (bg.mode === 'image') {
            bgLayer.style.background = `url('${bg.value}') center / cover no-repeat`;
            bgOverlay.style.background = 'rgba(0,0,0,0.45)';
        }

        // Some background images already have the Driven logo and event name
        // baked into the picture itself. When that's the case, hide our overlay
        // logo/name so it doesn't show twice.
        if (brandHeader) {
            brandHeader.style.display = bg.hideBrand ? 'none' : 'flex';
        }
    }

    // ---- Music ----
    const bgAudio = document.getElementById('bgAudio');
    const soundGate = document.getElementById('soundGate');
    let audioUnlocked = false;

    soundGate.addEventListener('click', () => {
        audioUnlocked = true;
        soundGate.style.display = 'none';
        bgAudio.play().catch(() => {});
    });

    function playMusic(url) {
        const sameSongPaused = bgAudio.src.endsWith(url) && bgAudio.paused && bgAudio.currentTime > 0;
        if (!sameSongPaused) {
            bgAudio.src = url;
        }
        if (audioUnlocked) {
            bgAudio.play().catch(err => console.error('Audio play failed:', err.message, '— src was:', bgAudio.src));
        } else {
            soundGate.style.display = 'flex';
        }
    }

    function pauseMusic() {
        bgAudio.pause();
    }

    function stopMusic() {
        bgAudio.pause();
        bgAudio.currentTime = 0;
        bgAudio.removeAttribute('src');
    }
    function setVolume(value) {
    bgAudio.volume = Math.min(1, Math.max(0, value));
    }


    const dbRef = ref(db, 'rooms/' + roomCode);
    onValue(dbRef, (snapshot) => {
        const msg = snapshot.val();
        if (msg) handleMessage(msg);
    });
</script>

</body>
