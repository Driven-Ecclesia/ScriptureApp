<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripture Display</title>
<style>
    :root{
        --navy:#0b1730;
        --navy-2:#16234a;
        --gold:#c9a24a;
        --gold-soft:#e3d6ae;
        --cream:#f3ead2;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    html, body{
        height:100%;
        font-family:'Georgia','Times New Roman',serif;
        color: var(--cream);
        overflow:hidden;
    }
    #bgLayer{
        position:fixed; inset:0;
        background: linear-gradient(180deg, #0b1730 0%, #16234a 55%, #0b1730 100%);
        background-size:cover;
        background-position:center;
        transition: background 0.6s ease;
        z-index:0;
    }
    #bgOverlay{
        position:fixed; inset:0;
        background: rgba(0,0,0,0);
        transition: background 0.6s ease;
        z-index:1;
        pointer-events:none;
    }
    .frame{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 8vw;
    text-align:center;
    position:relative;
    z-index:2;
    }
    #content{
    max-height: 80vh;
    overflow-y: auto;
    width: 100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) transparent;
    }
    #content::-webkit-scrollbar{ width:6px; }
    #content::-webkit-scrollbar-thumb{ background: var(--gold); border-radius:3px; }
    
    .community-name{
        position:absolute;
        top:4vh;
        left:0; right:0;
        text-align:center;
        font-size:1.1vw;
        letter-spacing:4px;
        text-transform:uppercase;
        color: var(--gold);
    }
    .verse-text{
    line-height:1.5;
    max-width: 1100px;
    color:#ffffff;
    transition: opacity 0.4s ease;
    /* font-size is now set dynamically in JS based on verse length */
    }
    .verse-ref{
        margin-top:4vh;
        font-size:1.5vw;
        color: var(--gold-soft);
        letter-spacing:1px;
        font-style:italic;
    }
    .rule{
        width:120px;
        height:2px;
        background: var(--gold);
        margin: 3.5vh auto 0 auto;
    }
    .placeholder{
        color:#8a92b3;
        font-size:1.6vw;
        font-style:italic;
        letter-spacing:0.5px;
    }
    .placeholder .cross{
        font-size:4vw;
        color: var(--gold);
        margin-bottom:20px;
        display:block;
    }
    .connection-note{
        position:absolute;
        bottom:3vh;
        left:0; right:0;
        text-align:center;
        font-size:0.8vw;
        color:#5a6690;
        letter-spacing:1px;
    }

    @media (max-width: 700px) {
        .verse-text{ font-size:6vw; }
        .verse-ref{ font-size:3.2vw; }
        .community-name{ font-size:3vw; }
        .placeholder{ font-size:4vw; }
    }
</style>
</head>
<body>

<div id="bgLayer"></div>
<div id="bgOverlay"></div>
<div class="frame">
    <div class="community-name" id="communityName">Driven Ecclesia</div>
    <div id="content">
        <div class="placeholder">
            <span class="cross">&#10013;</span>
            Waiting for scripture…
        </div>
    </div>
    <div class="connection-note">Read it, Live it, and let it Change your heart</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBowRtZf_IoFiiIPzMNNlkTxKQ2krCRJBM",
    authDomain: "driven-scripture.firebaseapp.com",
    databaseURL: "https://driven-scripture-default-rtdb.firebaseio.com",
    projectId: "driven-scripture",
    storageBucket: "driven-scripture.firebasestorage.app",
    messagingSenderId: "129202807693",
    appId: "1:129202807693:web:4eb080f18962aa6a9cd3c4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const content = document.getElementById('content');
    const communityNameEl = document.getElementById('communityName');

    const savedName = localStorage.getItem('scripture_community_name');
    if (savedName) communityNameEl.textContent = savedName;

    const params = new URLSearchParams(window.location.search);
    const roomCode = params.get('room') || 'main';

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Picks a font size (in vw) based on how long the verse text is,
    // so long verses (e.g. Esther 8:9) shrink to fit instead of overflowing.
    function getFontSize(text) {
        const len = text.length;
        if (len <= 90)  return 3.4;   // short verse, e.g. John 11:35
        if (len <= 160) return 2.8;
        if (len <= 260) return 2.3;
        if (len <= 380) return 1.9;
        if (len <= 550) return 1.55;  // covers verses like Esther 8:9 (~950 chars in some translations)
        if (len <= 800) return 1.3;
        return 1.1;                   // extremely long passages / multi-verse ranges
    }

    function handleMessage(msg) {
        if (msg.type === 'show_verse') {
            const v = msg.verse;
            const fontSize = getFontSize(v.text);
            content.style.opacity = 0;
            setTimeout(() => {
                content.innerHTML = `
                    <div class="verse-text" style="font-size:${fontSize}vw;">${escapeHtml(v.text)}</div>
                    <div class="rule"></div>
                    <div class="verse-ref">${escapeHtml(v.reference)} &mdash; ${escapeHtml(v.translationName)}</div>
                `;
                content.style.opacity = 1;
            }, 200);
        } else if (msg.type === 'clear') {
            content.innerHTML = `
                <div class="placeholder">
                    <span class="cross">&#10013;</span>
                    Waiting for scripture…
                </div>
            `;
        } else if (msg.type === 'community_name') {
            communityNameEl.textContent = msg.name;
        } else if (msg.type === 'background') {
            applyBackground(msg);
        }
    }

    function applyBackground(bg) {
        const bgLayer = document.getElementById('bgLayer');
        const bgOverlay = document.getElementById('bgOverlay');

        if (bg.mode === 'default') {
            bgLayer.style.background = 'linear-gradient(180deg, #0b1730 0%, #16234a 55%, #0b1730 100%)';
            bgOverlay.style.background = 'rgba(0,0,0,0)';
        } else if (bg.mode === 'color') {
            bgLayer.style.background = bg.value;
            bgOverlay.style.background = 'rgba(0,0,0,0.15)';
        } else if (bg.mode === 'image') {
            bgLayer.style.background = `url('${bg.value}') center / cover no-repeat`;
            bgOverlay.style.background = 'rgba(0,0,0,0.45)';
        }
    }

    const dbRef = ref(db, 'rooms/' + roomCode);
    onValue(dbRef, (snapshot) => {
        const msg = snapshot.val();
        if (msg) handleMessage(msg);
    });
</script>

</body>
</html>
